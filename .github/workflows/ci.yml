name: CI

# pull_request is deliberately absent while contribution intake is closed
# (see CONTRIBUTING.md and CLA.md) — a green PR run would promise a merge
# path that does not exist yet. Restore it when the CLA becomes operative.
on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (Swift 6.1+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ">=16.3"
      - name: Swift version
        run: swift --version
      - name: Build (fetches dependencies)
        run: swift build --build-tests
      # The no-telemetry claim in README.md is enforced, not asserted: the
      # whole suite runs under a network-deny sandbox. Any test or code path
      # that reaches for the network fails this job.
      - name: Test (hermetic — no network)
        run: |
          cat > /tmp/deny-network.sb <<'PROFILE'
          (version 1)
          (allow default)
          (deny network*)
          PROFILE
          sandbox-exec -f /tmp/deny-network.sb swift test --skip-build --disable-sandbox

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No dated comments in shipped source
        run: |
          if grep -rnE '(^|[^:])//.*20(25|26)-[0-9]{2}-[0-9]{2}' Sources Tests --include='*.swift'; then
            echo 'Dated engineering comment found in shipped source.' >&2
            exit 1
          fi
      - name: REUSE compliance
        uses: fsfe/reuse-action@v4
