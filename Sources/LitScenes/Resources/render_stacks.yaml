    stack_id: civitai.juggernaut_xl_v9.cinematic.v0
    label: Cinematic Realism
    detail: "CivitAI · Juggernaut XL v9 · cinematic live action · 1280×720"
    kind: civitai
    credential_provider: civitai
    order: 4
    model: "urn:air:sdxl:checkpoint:civitai:133005@348913"
    style_model: ""
    can_attach_style_image: false
    reframe_capable: false
    prompt_limit: 1800
    output_format: jpeg
    prompt_instructions: >-
      Juggernaut XL v9 should be prompted as a believable live-action frame.
      State the subject and visible action first, then location, composition,
      motivated lighting, camera distance or lens character, atmosphere, and
      tactile real-world materials. Use restrained photographic language and
      preserve ordinary imperfections; avoid long quality-token chains, CGI,
      game-engine language, excessive HDR, and contradictory camera terms.
    civitai:
      tags: [litscenes, lens, juggernaut-xl-v9, cinematic, image]
      step_priority: low
      seed: random
      input:
        engine: sdcpp
        ecosystem: sdxl
        operation: createImage
        model: "urn:air:sdxl:checkpoint:civitai:133005@348913"
        scheduler: DPM2Karras
        steps: 35
        cfgScale: 5
        clipSkip: 1
        width: 1280
        height: 720
        quantity: 1
        outputFormat: jpeg
      recipe:
        - { key: engine, value: sdcpp, value_type: string }
        - { key: ecosystem, value: sdxl, value_type: string }
        - { key: operation, value: createImage, value_type: string }
        - { key: model, value: "urn:air:sdxl:checkpoint:civitai:133005@348913", value_type: string }
        - { key: scheduler, value: DPM2Karras, value_type: string }
        - { key: steps, value: "35", value_type: number }
        - { key: cfg_scale, value: "5", value_type: number }
        - { key: clip_skip, value: "1", value_type: number }
        - { key: width, value: "1280", value_type: string }
        - { key: height, value: "720", value_type: string }
        - { key: quantity, value: "1", value_type: string }
        - { key: output_format, value: jpeg, value_type: string }
        - { key: seed, value: "$runtime_seed", value_type: string }

