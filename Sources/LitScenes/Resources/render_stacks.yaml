      materials, lighting, and mood. Keep constraints explicit, avoid long
      screenplay prose, and use the configured parameters for aspect, output
      format, steps, CFG, safety, and acceleration rather than writing
      resolution or aspect instructions into the prompt.
    fal:
      input:
        num_inference_steps: 4
        image_size: landscape_16_9
        guidance_scale: 3.5
        num_images: 1
        enable_safety_checker: true
        output_format: jpeg
