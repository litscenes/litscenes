# render_stacks.yaml — the Frame Creator render stacks.
#
# This bundled file defines the default stacks. To add your own or override a
# default, put a file with the same shape at:
#   ~/Library/Application Support/<release identity>/render_stacks.yaml
# Entries there merge by `id` (same id = override the default; new id = new
# stack). App Settings → Stacks has Reveal / Reload / Copy-defaults buttons.
#
# Fields per stack:
#   id                     unique machine id (persists in render provenance hashes)
#   stack_id               versioned recipe id written into each take's render recipe
#   label / detail         what the stack picker shows
#   price_note             informational provider price persisted in provenance
#   kind                   executor: openai | fal | civitai | stability
#   credential_provider    which API key gates it: openai | civitai | fal | stability
#                          (fal stacks also need an OpenAI key for prompt writing)
#   order                  position in pickers; also default-stack precedence
#   model                  provider model id (fal: queue path; civitai: informational)
#   style_model            fal only — the /edit or /redux variant used when a style
#                          image is attached ("" = none)
#   can_attach_style_image whether the model accepts a style-reference image
#   reframe_capable        whether the stack can take prompt-image attachments
#                          (drives the Reframe stack menu and the engine gate)
#   workflows              executable product workflows. When omitted, existing
#                          stacks default to frame_creator and reframe_capable
#                          maps to reframe_zoom_in + reframe_viewpoint.
#   prompt_image_limit     how many prompt images this MODEL accepts natively.
#                          Omitted = the provider-kind default (openai
#                          unbounded, fal/stability 1, civitai 0). Raise it
#                          only with the provider's documented maximum — the
#                          count rides straight into paid request payloads.
#   prompt_limit           max prompt characters sent to the provider (null = none)
#   output_format          jpeg | png — the saved file's format
#   image_size             openai only — the gpt-image size string
#   prompt_instructions    model-aware guidance given to the prompt-enrichment LLM
#   fal:                   fal request: `input` = the exact request body params
#                          (prompt is injected), `debug_keys` = keys the Parameters
#                          box may override
#   stability:             Stability multipart fields. `strength` is sent only
#                          when an input image is attached.
#   civitai:               civitai workflow: `input` = the exact imageGen step input
#                          (prompt/seed/negativePrompt injected), `tags`,
#                          `step_priority` (omit for none), `seed` (integer for a
#                          fixed seed, or "random"), `recipe` = the provenance
#                          parameters written to each take ($runtime_seed = the
#                          seed used at render time)
#
# NOTE: all stacks render WIDE (as close to 16:9 as each provider supports) so
# frames drop cleanly into the 16:9 video pipeline. gpt-image-2's widest is
# 1536x1024 (3:2); FLUX/Nano/CivitAI render true 16:9.

version: "litscenes.render_stacks.v0"
stacks:
  - id: openai_base
    stack_id: openai.base.v0
    label: OpenAI Base
    detail: "Available · gpt-image-2 · 1536×1024"
    kind: openai
    credential_provider: openai
    order: 0
    model: gpt-image-2
    style_model: ""
    can_attach_style_image: false
    reframe_capable: true
    workflows: [frame_creator, reframe_zoom_in, reframe_zoom_out, reframe_viewpoint]
    prompt_limit: null
    output_format: jpeg
    image_size: 1536x1024
    prompt_instructions: >-
      OpenAI gpt-image-2 prompts should be direct, specific, and visually rich.
      Describe the subject, environment, composition, mood, lighting, camera or
      rendering treatment, materials, colors, and any exact constraints. The
      model follows natural language well, supports detailed production-quality
      visuals, and benefits from clear accuracy boundaries when the image must
      preserve a real project world. Avoid unsupported transparent-background
      instructions for gpt-image-2.

  - id: stability_ultra
    stack_id: stability.ultra.v0
    label: Stability Ultra
    detail: "Stability AI · flagship · 1 MP · 1 native image"
    kind: stability
    credential_provider: stability
    order: 1
    model: stable-image-ultra
    style_model: stable-image-ultra
    can_attach_style_image: true
    reframe_capable: true
    workflows: [frame_creator, reframe_zoom_in, reframe_viewpoint]
    prompt_limit: 10000
    output_format: jpeg
    image_size: null
    prompt_instructions: >-
      Stability Stable Image Ultra prompts should clearly define the visible
      subject, environment, composition, lighting, materials, mood, and medium.
      Keep the positive prompt focused on desired content and use the negative
      prompt for concise exclusions. When an image is attached, treat it as the
      explicit structural, identity, or style reference described by its label.
    stability:
      input:
        aspect_ratio: "16:9"
        output_format: jpeg
        strength: 0.65

  - id: civitai_wan_2_7
    stack_id: civitai.wan_image_27.v0
    label: WAN 2.7
    detail: "CivitAI · WAN still · 1280×720 · app random seed"
    kind: civitai
    credential_provider: civitai
    order: 2
    model: wan.v2.7.text-to-image
    style_model: ""
    can_attach_style_image: false
    reframe_capable: false
    prompt_limit: 1800
    output_format: jpeg
    prompt_instructions: >-
      Civitai WAN 2.7 prompts should be self-contained text-to-image requests.
      Keep the style in text as a concise one-line visual direction and avoid
      relying on image attachments.
    civitai:
      tags: [litscenes, lens, wan-2-7, image]
      step_priority: low
      seed: random
      input:
        engine: wan
        version: v2.7
        provider: fal
        operation: createImage
        cfgScale: 0
        sampler: "WAN-2.7"
        workflow: txt2img
        width: 1280
        height: 720
        priority: low
        quantity: 1
        imageSize: landscape_16_9
        ecosystem: WanImage27
        outputFormat: jpeg
        resources: []
        enablePromptEnhancer: false
        enableSafetyChecker: true
        usePro: false
      recipe:
        - { key: workflow, value: txt2img, value_type: string }
        - { key: ecosystem, value: WanImage27, value_type: string }
        - { key: operation, value: createImage, value_type: string }
        - { key: version, value: v2.7, value_type: string }
        - { key: provider, value: fal, value_type: string }
        - { key: width, value: "1280", value_type: string }
        - { key: height, value: "720", value_type: string }
        - { key: image_size, value: landscape_16_9, value_type: string }
        - { key: priority, value: low, value_type: string }
        - { key: quantity, value: "1", value_type: string }
        - { key: output_format, value: jpeg, value_type: string }
        - { key: enable_prompt_enhancer, value: "false", value_type: boolean }
        - { key: enable_safety_checker, value: "true", value_type: boolean }
        - { key: use_pro, value: "false", value_type: boolean }
        - { key: seed, value: "$runtime_seed", value_type: string }

  - id: civitai_realistic_portrait
    stack_id: civitai.flux_klein_portrait.v0
    label: Realistic Portrait
    detail: "CivitAI · Flux.2 Klein · detailed-skin LoRA · 1280×720 · fixed seed"
    kind: civitai
    credential_provider: civitai
    order: 3
    model: flux.2-klein.portrait-engine
    style_model: ""
    can_attach_style_image: false
    reframe_capable: false
    prompt_limit: 1800
    output_format: jpeg
    prompt_instructions: >-
      Civitai FLUX.2 Klein portrait prompts should describe one clearly framed
      person, the expression and action, environment, wardrobe, light direction,
      lens distance, and natural skin texture. Prefer concrete photographic
      language over quality-token piles. Keep the detailed-skin LoRA implicit;
      do not repeat LoRA syntax or request waxy, airbrushed skin.
    civitai:
      tags: [litscenes, lens, realistic-portrait, image]
      # no step_priority — the flux2 step wrapper carries none
      seed: 292181528
      input:
        engine: flux2
        model: klein
        modelVersion: 9b
        operation: createImage
        steps: 8
        cfgScale: 5
        width: 1280
        height: 720
        quantity: 1
        outputFormat: jpeg
        loras:
          "urn:air:flux2:lora:civitai:2067704@2998669": 1.0
      recipe:
        - { key: engine, value: flux2, value_type: string }
        - { key: model, value: klein, value_type: string }
        - { key: model_version, value: 9b, value_type: string }
        - { key: operation, value: createImage, value_type: string }
        - { key: steps, value: "8", value_type: number }
        - { key: cfg_scale, value: "5", value_type: number }
        - { key: seed, value: "292181528", value_type: number }
        - { key: lora, value: "urn:air:flux2:lora:civitai:2067704@2998669", value_type: string }
        - { key: width, value: "1280", value_type: string }
        - { key: height, value: "720", value_type: string }
        - { key: quantity, value: "1", value_type: string }
        - { key: output_format, value: jpeg, value_type: string }

  # Sources: Civitai AIR/model version documented by the Civitai SDK tutorial;
  # RunDiffusion's model guide and community workflows converge on DPM++ 2M
  # Karras, 30–40 steps, and moderate CFG for Juggernaut XL v9.
