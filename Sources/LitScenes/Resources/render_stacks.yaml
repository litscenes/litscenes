    credential_provider: fal
    order: 9
    model: fal-ai/flux-2-pro
    style_model: fal-ai/flux-2-pro/edit
    can_attach_style_image: true
    reframe_capable: true
    workflows: [frame_creator, reframe_zoom_in, reframe_viewpoint]
