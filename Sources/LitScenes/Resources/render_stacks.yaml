    style_model: fal-ai/flux/schnell/redux
    can_attach_style_image: false
    reframe_capable: false
    prompt_limit: 2400
    output_format: jpeg
    prompt_instructions: >-
      FAL FLUX Schnell is a fast FLUX text-to-image path. Prompt it with
