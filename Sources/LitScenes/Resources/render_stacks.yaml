    prompt_image_limit: 9
    prompt_limit: 2400
    output_format: jpeg
    prompt_instructions: >-
      FAL FLUX 2 Pro is a streamlined professional image model. It benefits
      from direct, high-signal prompts that define the subject, scene
      structure, desired realism or illustration treatment, and concrete
